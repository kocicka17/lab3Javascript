<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 3 — Update</title>
</head>
<body>
    <script>
        const initialShips = [
            { id: "S-001", name: "Мрія Океану", homePort: "Одеса", type: "Контейнеровоз", displacement: 45000, captain: "Олександр Коваленко" },
            { id: "S-002", name: "Чорноморський Вітер", homePort: "Чорноморськ", type: "Танкер", displacement: 62000, captain: "Ігор Бондаренко" },
            { id: "S-003", name: "Альбатрос", homePort: "Одеса", type: "Балкер", displacement: 38000, captain: "Сергій Ткаченко" }
        ];

        function updateShip(ships, id, changes) {
            return ships.map(ship => (ship.id === id ? { ...ship, ...changes } : ship));
        }

        const afterUpdate = updateShip(initialShips, "S-002", {
            captain: "Василь Кравчук",
            displacement: 65000
        });

        console.log("Початковий об'єкт S-002 (не змінився):", initialShips[1]);
        console.log("Оновлений масив після Update:", afterUpdate);
    </script>
</body>
</html>

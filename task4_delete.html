<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 4 — Delete</title>
</head>
<body>
    <script>
        const initialShips = [
            { id: "S-001", name: "Мрія Океану", homePort: "Одеса", type: "Контейнеровоз", displacement: 45000, captain: "Олександр Коваленко" },
            { id: "S-002", name: "Чорноморський Вітер", homePort: "Чорноморськ", type: "Танкер", displacement: 62000, captain: "Ігор Бондаренко" },
            { id: "S-003", name: "Альбатрос", homePort: "Одеса", type: "Балкер", displacement: 38000, captain: "Сергій Ткаченко" }
        ];

        function deleteShip(ships, id) {
            return ships.filter(ship => ship.id !== id);
        }

        const afterDelete = deleteShip(initialShips, "S-001");

        console.log("Початковий масив (довжина):", initialShips.length, initialShips);
        console.log("Новий масив після Delete (довжина):", afterDelete.length, afterDelete);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 2 — Read</title>
</head>
<body>
    <script>
        const initialShips = [
            { id: "S-001", name: "Мрія Океану", homePort: "Одеса", type: "Контейнеровоз", displacement: 45000, captain: "Олександр Коваленко" },
            { id: "S-002", name: "Чорноморський Вітер", homePort: "Чорноморськ", type: "Танкер", displacement: 62000, captain: "Ігор Бондаренко" },
            { id: "S-003", name: "Альбатрос", homePort: "Одеса", type: "Балкер", displacement: 38000, captain: "Сергій Ткаченко" }
        ];

        // 2.1 Пошук одного об'єкта за id
        function readShipById(ships, id) {
            return ships.find(ship => ship.id === id);
        }

        // 2.2 Пошук декількох об'єктів за іншим атрибутом (портом приписки)
        function readShipsByHomePort(ships, homePort) {
            return ships.filter(ship => ship.homePort === homePort);
        }

        const foundById = readShipById(initialShips, "S-002");
        console.log("Результат пошуку за id 'S-002':", foundById);

        const foundByPort = readShipsByHomePort(initialShips, "Одеса");
        console.log("Кораблі з порту приписки 'Одеса':", foundByPort);
    </script>
</body>
</html>
